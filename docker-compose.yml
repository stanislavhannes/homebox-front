# Start: cp .env.example .env, ausfüllen, dann: docker compose up -d
services:
  homebox-front:
    image: ghcr.io/stanislavhannes/homebox-front:latest
    # Oder lokal bauen statt das fertige Image zu ziehen:
    # build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    volumes:
      # Pages, Passwörter, Logos und Einstellungen (SQLite)
      - homebox-front-data:/data

volumes:
  homebox-front-data:
